<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نورا نیک‌نفس | اولین جشن تولد</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600&family=Gulzar&display=swap" rel="stylesheet">


<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}


body{

    margin:0;
    font-family:Vazirmatn,sans-serif;

    background:
    radial-gradient(circle at top,#fff2df,#e8d3b0 40%,#20151b);

    color:white;

}


section{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:40px 20px;

    position:relative;

}


.glass{

background:
rgba(255,255,255,.15);

backdrop-filter:blur(18px);

border:
1px solid rgba(255,255,255,.3);

box-shadow:
0 20px 50px rgba(0,0,0,.25);

border-radius:35px;

padding:35px;

width:min(430px,95%);

text-align:center;

}


h1,h2{

font-family:Gulzar,serif;

font-weight:400;

}



h1{

font-size:48px;

margin:10px;

}


h2{

font-size:32px;

}



p{

line-height:2;

}



.cover img{

width:230px;

height:230px;

object-fit:cover;

border-radius:50%;

border:5px solid rgba(255,255,255,.5);

box-shadow:0 0 50px #ffd77a;

}


button{

border:none;

padding:14px 28px;

border-radius:50px;

cursor:pointer;

background:
linear-gradient(135deg,#fff0b0,#d4a44c);

color:#4b2b13;

font-size:16px;

margin-top:20px;

}



.scroll{

position:absolute;

bottom:25px;

animation:down 1.5s infinite;

font-size:30px;

}


@keyframes down{

50%{
transform:translateY(10px);
}

}


.reveal{

opacity:0;

transform:translateY(40px);

transition:1s;

}


.reveal.active{

opacity:1;

transform:none;

}



.count{

display:flex;

justify-content:center;

gap:12px;

}


.time{

background:rgba(255,255,255,.2);

padding:15px;

border-radius:20px;

}



.maps{

display:flex;

gap:10px;

justify-content:center;

flex-wrap:wrap;

}


.maps img{

width:45px;

height:45px;

}



a{

text-decoration:none;

color:white;

}



input,textarea{

width:100%;

margin:8px 0;

padding:12px;

border-radius:15px;

border:none;

background:white;

}



</style>

</head>


<body>



<audio id="music" loop>

<source src="assets/birthday.mp3">

</audio>



<section class="cover">


<div class="glass reveal">


<img src="assets/noora.png">


<h1>
نورا جان
</h1>


<p>
اولین جشن تولد من
</p>


<button onclick="openCard()">

باز کردن دعوتنامه ✨

</button>


</div>


<div class="scroll">
⌄
</div>


</section>





<section>

<div class="glass reveal">


<h2>
به افتخار یک سالگی نورا
</h2>


<p>
پیمان نیک‌نفس و مهناز شیرج‌پور
با افتخار شما را دعوت می‌کنند
</p>


</div>


<div class="scroll">
⌄
</div>

</section>





<section>

<div class="glass reveal">


<h2>
جشن تولد نورا
</h2>


<p>
پنج‌شنبه ۹ مهر<br>
ساعت ۱۸:۰۰
</p>


<div class="count">


<div class="time">
<span id="d">0</span>
<br>
روز
</div>


<div class="time">
<span id="h">0</span>
<br>
ساعت
</div>


<div class="time">
<span id="m">0</span>
<br>
دقیقه
</div>


</div>



</div>


<div class="scroll">
⌄
</div>

</section>






<section>


<div class="glass reveal">


<h2>
تالار دوریکا
</h2>


<p>
نشتارود
</p>



<div class="maps">


<a href="https://maps.app.goo.gl/fr6qwoFRzFqAugk98">

<img src="assets/g.png">

</a>


<a href="https://nshn.ir/2e_bf-IH5x5Y4D">

<img src="assets/n.png">

</a>


<a href="https://balad.ir/p/7ahglm8ucy5Qjp">

<img src="assets/b.png">

</a>


</div>


</div>



<div class="scroll">
⌄
</div>


</section>







<section>


<div class="glass reveal">


<h2>
اعلام حضور
</h2>


<input placeholder="نام شما">


<select style="width:100%;padding:12px;border-radius:15px">

<option>
با افتخار می‌آیم
</option>

<option>
متأسفانه نمی‌توانم بیایم
</option>

</select>



<input placeholder="تعداد نفرات">


<textarea placeholder="پیام شما"></textarea>


<button>
ثبت پاسخ
</button>



</div>


</section>





<script>


function openCard(){

document
.getElementById("music")
.play();


}



let target =
new Date("2026-10-01T18:00:00")
.getTime();



setInterval(()=>{


let now=new Date().getTime();

let diff=target-now;


document.getElementById("d").innerHTML=
Math.floor(diff/(1000*60*60*24));


document.getElementById("h").innerHTML=
Math.floor(diff/(1000*60*60)%24);


document.getElementById("m").innerHTML=
Math.floor(diff/(1000*60)%60);



},1000);





const observer=
new IntersectionObserver(entries=>{


entries.forEach(e=>{


if(e.isIntersecting)

e.target.classList.add("active");


})


});



document.querySelectorAll(".reveal")
.forEach(el=>observer.observe(el));



</script>


</body>
</html>
