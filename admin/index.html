d:linear-gradient(135deg,#d6ad58,#b98b3b)}.guest-status{font-size:20px;padding:4px 10px;border-radius:999px;background:#f5effa;white-space:nowrap}.guest-status.yes{background:#e9f7ed;color:#4c8a5a}.guest-status.no{background:#fff0f0;color:#a66b6b}.guest-meta{margin-top:7px;font-size:24px;color:#8b719b;line-height:1.9}.guest-link{display:inline-block;margin-top:5px;font-family:Arial,sans-serif;font-size:13px;direction:ltr;word-break:break-all;color:#9b849f}.message-box{display:none;margin-top:10px;padding:12px 14px;border-radius:14px;background:#fff9f2;border:1px solid #d6ad5855;font-size:21px;line-height:1.9;color:var(--text);white-space:pre-wrap}.message-box.show{display:block}.message-btn{width:auto!important;margin-top:9px!important;padding:7px 15px!important;font-size:19px!important;box-shadow:none!important;background:linear-gradient(135deg,#b9a7e8,#d8a8d0)}.empty,.loading{text-align:center;font-size:23px;color:#9b849f;padding:20px 8px;line-height:1.8}.list-actions{display:grid;gap:10px;margin-top:22px}.list-actions button{font-size:24px;padding:13px 16px}.reset-list{background:linear-gradient(135deg,#d99a9a,#b86f6f)}.note{text-align:center;font-size:21px;color:#9b849f;margin:60px 12px 20px;line-height:2.1;padding:0 8px}.note a{color:var(--gold-deep);text-decoration:none}.footer-heart{font-size:.72em;vertical-align:middle;display:inline-block}@media(max-width:600px){.wrap{width:min(92%,680px);padding:46px 0 80px}.header{padding:0 16px}.header h1{font-size:48px;line-height:1.7;margin-top:10px}.header p{font-size:24px;line-height:1.9}.card,.list-card{padding:26px 18px;border-radius:26px}.field label{font-size:26px}input{font-size:25px}.guest-main{align-items:flex-start}.guest-name{font-size:25px}.link-copy{font-size:17px!important;padding:6px 11px!important}.guest-status{font-size:18px}.list-head h2{font-size:32px}.list-head p{font-size:20px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{padding:15px 7px}.stat strong{font-size:42px}.stat span <body><main class="wrap"><header class="header"><div class="star">✦　✧　✦</div><h1>پنل مدیریت دعوتنامه‌های تولد نورا جون</h1><p>ساخت و مدیریت لینک‌های اختصاصی مهمان‌ها</p></header>
<section class="card"><div class="field"><label for="guestName">نام مهمان</label><input id="guestName" type="text" placeholder="مثلاً مریم" autocomplete="off"></div><button id="create">✦ ساخت لینک اختصاصی ✦</button><div class="status" id="status" aria-live="polite"></div><div class="result" id="result"><div class="result-title">لینک مهمان ذخیره شد ✦</div><div class="linkbox" id="link"></div><button class="copy" id="copy">کپی لینک</button></div></section>
<section class="list-card"><div class="list-head"><h2>مهمان‌های ثبت‌شده</h2><p>فهرست مهمان‌هایی که تا الان برایشان لینک ساخته شده</p></div><div class="stats"><div class="stat"><strong id="totalGuests">۰</strong><span>کل دعوت‌نامه‌ها</span></div><div class="stat"><strong id="answeredGuests">۰</strong><span>پاسخ داده‌اند</span></div><div class="stat"><strong id="attendingGuests">۰</strong><span>می‌آیند</span></div></div><div class="guest-list" id="guestList"><div class="loading">در حال دریافت فهرست مهمان‌ها…</div></div><div class="list-actions"><button type="button" class="reset-list" id="resetList">پاک کردن کامل لیست مهمان‌ها</button></div></section>
<div class="note">ساخته شده با عشق توسط <a href="https://t.me/ThisIsAnahita" target="_blank" rel="noopener noreferrer">زن‌دایی آنا <span class="footer-heart">♡</span></a></div></main>
<iframe name="guestSaveFrame" id="guestSaveFrame" hidden></iframe><form id="saveForm" target="guestSaveFrame" method="POST" style="display:none"><input name="action" value="create_guest"><input name="guestId" id="saveGuestId"><input name="name" id="saveName"><input name="maxGuests" value="7"><input name="invitationUrl" id="saveUrl"></form>
<script src="../js/config.js?v=20260927-4"></script><script>
const GS_ENDPOINT=(window.NOORA_CONFIG&&window.NOORA_CONFIG.GOOGLE_APPS_SCRIPT_URL)||"https://script.google.com/macros/s/AKfycbwbAFhiYbNwpqxczEQzeQNbGm1yIYGveTBUvQ-Cu3zfKFKPdS8wcaNI4CdarzSmwolbuA/exec";const base=new URL("../",location.href).href;const nameEl=document.getElementById("guestName"),result=document.getElementById("result"),linkEl=document.getElementById("link"),statusEl=document.getElementById("status"),createBtn=document.getElementById("create"),saveForm=document.getElementById("saveForm");saveForm.action=GS_ENDPOINT;
const buildGuestUrl=id=>base+"?g="+encodeURIComponent(id);function faNum(n){return String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d])}function showStatus(message,error=false){statusEl.textContent=message;statusEl.className="status show"+(error?" error":"")}function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function renderGuestList(data){const list=document.getElementById("guestList");document.getElementById("totalGuests").textContent=faNum(data.count||0);const guests=data.guests||[];document.getElementById("answeredGuests").textContent=faNum(guests.filter(g=>g.attendance&&g.attendance!=="بدون پاسخ").length);document.getElementById("attendingGuests").textContent=faNum(guests.filter(g=>g.attendance==="می‌آید").length);if(!guests.length){list.innerHTML='<div class="empty">هنوز مهمانی ثبت نشده است.</div>';return}list.innerHTML=guests.map((g,i)=>{const cls=g.attendance==="می‌آید"?"yes":g.attendance==="نمی‌آید"?"no":"";const msg=String(g.message||"");return '<div class="guest-row"><div class="guest-main"><div class="guest-name">'+escapeHtml(g.name)+'</div><button type="button" class="copy link-copy" data-url="'+escapeHtml(g.invitationUrl||"")+'">📋 کپی لینک</button><div class="guest-status '+cls+'">'+escapeHtml(g.attendance||"بدون پاسخ")+'</div></div><div class="guest-meta">تعداد نفرات ثبت‌شده: '+(g.guestCount==null?"—":faNum(g.guestCount))+'</div>'+(msg?'<button type="button" class="message-btn" data-msg="'+escapeHtml(msg)+'">نمایش پیام</button><div class="message-box">'+escapeHtml(msg)+'</div>':'<div class="guest-meta">پیامی ثبت نشده است.</div>')+'</div></div>'}).join("");list.querySelectorAll(".message-btn").forEach(btn=>btn.onclick=()=>{const box=btn.nextElementSibling;const open=box.classList.toggle("show");btn.textContent=open?"بستن پیام":"نمایش پیام"});list.querySelectorAll(".link-copy").forEach(btn=>btn.onclick=async()=>{await navigator.clipboard.writeText(btn.dataset.url);btn.textContent="✓ کپی شد";setTimeout(()=>btn.textContent="📋 کپی لینک",1600)})}
function renderLinkList(links){const list=document.getElementById("linkList");if(!links.length){list.innerHTML='<div class="empty">هنوز لینکی ساخته نشده است.</div>';return}list.innerHTML=links.map(g=>'<div class="guest-row"><div class="guest-main"><div class="guest-name">'+escapeHtml(g.name)+'</div><button type="button" class="copy link-copy" data-url="'+escapeHtml(g.url||g.invitationUrl||"")+'" style="width:auto;padding:8px 16px;font-size:20px">📋 کپی لینک</button></div><div class="guest-link">'+escapeHtml(g.url||g.invitationUrl||"")+'</div></div>').join("");list.querySelectorAll(".link-copy").forEach(btn=>btn.onclick=async()=>{await navigator.clipboard.writeText(btn.dataset.url);btn.textContent="✓ کپی شد";setTimeout(()=>btn.textContent="📋 کپی لینک",1600)})}
function loadGuests(){const list=document.getElementById("guestList"),callback="nooraGuests_"+Date.now();let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(timer);delete window[callback];const old=document.getElementById(callback);if(old)old.remove()};window[callback]=(data)=>{try{if(!data||!data.ok)throw new Error("load_failed");renderGuestList(data)}catch(e){list.innerHTML='<div class="empty">دریافت فهرست مهمان‌ها انجام نشد.</div>'}finish()};const s=document.createElement("script");s.id=callback;s.src=GS_ENDPOINT+"?action=list_guests&callback="+callback+"&t="+Date.now();s.onerror=()=>{list.innerHTML='<div class="empty">ارتباط با Google Sheets برقرار نشد.</div>';finish()};document.body.appendChild(s);const timer=setTimeout(()=>{list.innerHTML='<div class="empty">ارتباط با Google Sheets برقرار نشد. لطفاً دوباره تلاش کنید.</div>';finish()},7000)}
function loadLinks(){const list=document.getElementById("linkList"),callback="nooraLinks_"+Date.now();window[callback]=(data)=>{try{if(!data||!data.ok)throw new Error("load_failed");renderLinkList(data.links||[])}catch(e){list.innerHTML='<div class="empty">دریافت لینک‌ها انجام نشد.</div>'}delete window[callback];const old=document.getElementById(callback);if(old)old.remove()};const script=document.createElement("script");script.id=callback;script.src=GS_ENDPOINT+"?action=list_links&callback="+callback+"&t="+Date.now();script.onerror=()=>{list.innerHTML='<div class="empty">ارتباط با Google Sheets برقرار نشد.</div>';delete window[callback];script.remove()};document.body.appendChild(script)}
function findExistingGuest(name){return new Promise((resolve,reject)=>{const callback="nooraFind_"+Date.now()+"_"+Math.random().toString(36).slice(2);let done=false;const finish=(fn,value)=>{if(done)return;done=true;clearTimeout(timer);delete window[callback];const old=document.getElementById(callback);if(old)old.remove();fn(value)};window[callback]=(data)=>{if(data&&data.ok)finish(resolve,data.guest||null);else if(data&&data.error==="guest_not_found")finish(resolve,null);else finish(reject,new Error("find_failed"))};const script=document.createElement("script");script.id=callback;script.src=GS_ENDPOINT+"?action=find_guest&name="+encodeURIComponent(name)+"&callback="+callback+"&t="+Date.now();script.onerror=()=>finish(reject,new Error("network"));document.body.appendChild(script);const timer=setTimeout(()=>finish(resolve,null),5000)})}
createBtn.onclick=async()=>{const name=nameEl.value.trim();if(!name){nameEl.focus();nameEl.style.borderColor="#d69a9a";showStatus("لطفاً نام مهمان را وارد کنید.",true);return}createBtn.disabled=true;showStatus("در حال بررسی مهمان‌های قبلی…");try{const existing=await findExistingGuest(name);if(existing){const existingUrl=existing.url||existing.invitationUrl||"";linkEl.textContent=existingUrl;result.classList.add("show");showStatus("این مهمان قبلاً لینک گرفته است؛ لینک جدید ساخته نشد.");createBtn.disabled=false;return}const id="N"+Array.from(crypto.getRandomValues(new Uint8Array(5))).map(b=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b%31]).join("");const url=buildGuestUrl(id);document.getElementById("saveGuestId").value=id;document.getElementById("saveName").value=name;document.getElementById("saveUrl").value=url;saveForm.submit();linkEl.textContent=url;result.classList.add("show");showStatus("در حال ذخیره مهمان");setTimeout(()=>{createBtn.disabled=false;showStatus("مهمان در شیت ذخیره شد؛ لینک دائمی آماده است.");loadGuests()},1200)}catch(e){createBtn.disabled=false;showStatus("بررسی مهمان قبلی انجام نشد؛ دوباره تلاش کنید.",true)}};
document.getElementById("copy").onclick=async()=>{await navigator.clipboard.writeText(linkEl.textContent);document.getElementById("copy").textContent="✓ لینک کپی شد";setTimeout(()=>document.getElementById("copy").textContent="کپی لینک",1800)};document.getElementById("resetList").onclick=()=>{if(!confirm("مطمئنی می‌خوای کل لیست مهمان‌ها پاک بشه؟"))return;if(!confirm("این کار نام مهمان‌ها و پاسخ‌های ثبت‌شده را برای همیشه پاک می‌کند. واقعاً مطمئنی؟"))return;const frame=document.getElementById("guestSaveFrame");const form=document.createElement("form");form.method="POST";form.target=frame;form.style.display="none";const input=document.createElement("input");input.name="action";input.value="reset_all";form.appendChild(input);document.body.appendChild(form);form.submit();showStatus("در حال پاک کردن کامل لیست…");setTimeout(()=>{showStatus("لیست مهمان‌ها و پاسخ‌ها پاک شد.");result.classList.remove("show");nameEl.value="";loadGuests();loadLinks()},1200)};loadGuests();
</script></body></html>
